<ion-content [fullscreen]="true">

 <ion-row *ngFor="let produto of this.lista_compras">
    <ion-col>Nome: {{produto.nome}}</ion-col>
    <ion-col *ngIf="produto.promocao" style="color: green">Promocão: Sim</ion-col>
    <ion-col *ngIf="!produto.promocao" style="color: red">Promocão: Não</ion-col>
    <ion-col>Preço: R${{produto.preco}}</ion-col>
    <ion-col>Marca: {{produto.marca}}</ion-col>
 </ion-row>

</ion-content>
