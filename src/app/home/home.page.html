<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="6" class="imagem-col">
        <img src="https://images.pexels.com/photos/4403999/pexels-photo-4403999.jpeg" class="imagem">
      </ion-col>
      <ion-col size="6" class="formulario-col">
        <div class="container">
          <h1 class="titulo">Sign up</h1>
          <ion-input [(ngModel)] = "this.usuario.nome" class="input" label="Nome" type="text" labelPlacement="floating"></ion-input>
          <ion-input [(ngModel)] = "this.usuario.email" class="input" label="Email" type="email" labelPlacement="floating"></ion-input>
          <ion-input [(ngModel)] = "this.usuario.senha" class="input" label="Senha" type="password" labelPlacement="floating"></ion-input>
          <ion-input [(ngModel)] = "this.usuario.senha_confirmada" label="Confirmar senha" type="password" labelPlacement="floating"></ion-input>
          <ion-button color="primary" (click)="cadastrar()"> Criar conta</ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
