<ion-content [fullscreen]="true">
    <ion-label>LIVROS</ion-label>
    <br>
    <table>
        <tr>
            <th>Título</th>
            <th>ISBN</th>
            <th>Categoria(as)</th>
            <th>Ações</th>
        </tr>
            <ng-container *ngFor="let livro of this.livros">
                <tr>
                <td>{{livro.titulo}}</td>
                <td>{{livro.isbn}}</td>
                 <td>
                     <ion-card>
                <ng-container *ngFor="let cate of livro.categoria">
                        <ion-row>
                            <ion-col size="12">
                                <ion-label>{{cate.nome}}</ion-label>
                            </ion-col>
                        </ion-row>
                    </ng-container>
                </ion-card>
                </td>
                <td>
                    <ion-button>
                        <ion-icon name="open-outline"></ion-icon>
                    </ion-button>
                    <ion-button>
                        <ion-icon name="trash-outline"></ion-icon>
                    </ion-button>
                </td>
            </tr>
        </ng-container>
    </table>
    <br>

    <ion-label>PRODUTOS</ion-label>
    <br>
    <table>
        <tr>
            <th>Nome</th>
            <th>Preco</th>
            <th>Estoque</th>
            <th>Marca</th>
            <th>Ações</th>
        </tr>
            <ng-container *ngFor="let produto of this.produtos">
                <tr>
                <td>{{produto.nome}}</td>
                <td>R${{produto.preco}}</td>
                <td>{{produto.estoque}}</td>
                 <td>
                     <ion-card>
                <ng-container *ngFor="let marc of produto.marca">
                        <ion-row>
                            <ion-col size="12">
                                <ion-label>{{marc.nome}}</ion-label>
                            </ion-col>
                        </ion-row>
                    </ng-container>
                </ion-card>
                </td>
                <td>
                    <ion-button>
                        <ion-icon name="open-outline"></ion-icon>
                    </ion-button>
                    <ion-button>
                        <ion-icon name="trash-outline"></ion-icon>
                    </ion-button>
                </td>
            </tr>
        </ng-container>
